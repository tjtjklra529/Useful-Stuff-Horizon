name: Horizon port
on:
  push:
    paths: ['horizon/**', '.github/workflows/horizon.yml', 'tools/verify_horizon_review_fixes.py', 'artwork/horizon-quiver/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HORIZON_REV: f037744a79f9982c47876f49c5a3067279f88706
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '1.99.1'}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            /tmp/horizon/target
          key: horizon-tool-f037744a-rust-1.99.1
      - name: Build the pinned official packaging tool
        run: |
          if [ -x /tmp/horizon/target/debug/cargo-horizon-mod ]; then exit 0; fi
          git init /tmp/horizon
          git -C /tmp/horizon remote add origin https://github.com/horizon-rust/horizon.git
          git -C /tmp/horizon fetch --depth 1 origin "$HORIZON_REV"
          git -C /tmp/horizon checkout --detach "$HORIZON_REV"
          if [ ! -x /tmp/horizon/target/debug/cargo-horizon-mod ]; then
            cargo build --locked --manifest-path /tmp/horizon/Cargo.toml -p cargo-horizon-mod
          fi
      - name: Create a verified exact-SDK scaffold
        run: /tmp/horizon/target/debug/cargo-horizon-mod horizon-mod new horizon-template --template native --horizon "$HORIZON_REV"
      - name: Prepare the exact API source
        run: |
          mkdir -p horizon/.horizon/sdk/api
          python3 - <<'PY'
          import urllib.request,json,hashlib,tarfile,io
          rev='f037744a79f9982c47876f49c5a3067279f88706'
          base=f'https://github.com/horizon-rust/horizon/releases/download/sdk-{rev}/'
          payload=urllib.request.urlopen(base+'api-source.tar.xz').read()
          print('API source SHA256:',hashlib.sha256(payload).hexdigest())
          with tarfile.open(fileobj=io.BytesIO(payload),mode='r:xz') as archive:
              archive.extractall('horizon/.horizon/sdk/api',filter='data')
          PY
      - name: Verify namespace and original artwork review fixes
        run: python3 tools/verify_horizon_review_fixes.py
      - name: Check native code and run pure unit tests
        if: github.repository != 'tjtjklra529/Utilitarian'
        run: cargo test --manifest-path horizon/Cargo.toml
      - name: Package and check
        working-directory: horizon
        run: |
          /tmp/horizon/target/debug/cargo-horizon-mod horizon-mod build
          find . -name '*.hmod' -not -path '*/.horizon/*' -print
          find . -name '*.hmod' -not -path '*/.horizon/*' -exec /tmp/horizon/target/debug/cargo-horizon-mod horizon-mod check '{}' \;
      - name: Compile against the published game SDK
        if: success() && github.repository == 'tjtjklra529/Utilitarian'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxkbcommon-x11-0 libasound2t64 libvulkan1
          curl --fail --location --output /tmp/launcher.tar.gz https://github.com/horizon-rust/horizon/releases/download/launcher%400.2.102/horizon-launcher-linux-x86_64.tar.gz
          mkdir /tmp/launcher
          tar -xzf /tmp/launcher.tar.gz -C /tmp/launcher
          launcher=$(find /tmp/launcher -type f -name horizon-launcher | head -1)
          mkdir -p "$HOME/.minecraft/versions/26.3"
          gh release download horizon-build-input-26.3-20261122 --repo tjtjklra529/Utilitarian --pattern 26.3.jar --dir "$HOME/.minecraft/versions/26.3"
          gh release download horizon-build-input-26.3-20261122 --repo tjtjklra529/Utilitarian --pattern minecraft-26.3-libraries.zip --dir /tmp
          echo 'b6b4cfd2716af6ba752703d079fc995a5dbcb98d8fb19b966ef1105d2b048a6f  /tmp/minecraft-26.3-libraries.zip' | sha256sum -c -
          unzip -q /tmp/minecraft-26.3-libraries.zip -d "$HOME/.minecraft"
          echo 'e877b6a07acd633fb3bb475002175cec036e7b87  '"$HOME/.minecraft/versions/26.3/26.3.jar" | sha1sum -c -
          python3 - <<'PY'
          import os,json,pathlib,hashlib,urllib.request,concurrent.futures
          root=pathlib.Path.home()/'.minecraft'
          manifest=json.loads((root/'versions/26.3/26.3.json').read_text())
          artifacts=[l['downloads']['artifact'] for l in manifest['libraries'] if 'artifact' in l.get('downloads',{})]
          def install(a):
              path=root/'libraries'/a['path']
              if path.exists() and hashlib.sha1(path.read_bytes()).hexdigest()==a['sha1']: return
              payload=urllib.request.urlopen(a['url']).read()
              assert hashlib.sha1(payload).hexdigest()==a['sha1'],a['path']
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(payload)
              print('Verified platform dependency:',a['path'])
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:list(pool.map(install,artifacts))
          PY
          "$launcher" settings minecraft-dir "$HOME/.minecraft"
          "$launcher" install nightly | tee installed-base.txt
          base=$(sed -n 's/^Installed \([^ .]*\).*/\1/p' installed-base.txt | head -1)
          test -n "$base"
          "$launcher" prepare --version "$base"
          python3 -m zipfile -e horizon/target/horizon-mod/useful_stuff.hmod /tmp/useful-stuff-native-source
          set -o pipefail
          "$launcher" native-build /tmp/useful-stuff-native-source --server-output /tmp/useful-stuff-sdk-build --trust-native-code 2>&1 | tee native-build.txt
          python3 - <<'PY'
          import pathlib,json,re
          root=pathlib.Path.home()/'.local/share/horizon-launcher'
          sdks=[]
          for p in root.rglob('sdk.json'):
              try:
                  v=json.loads(p.read_text())
                  if 'build' in v and 'toolchain' in v:sdks.append({'path':str(p),'build':v['build'],'toolchain':v['toolchain'],'surface':v.get('surface')})
              except (OSError,ValueError):pass
          versions=sorted({p.name for p in root.rglob('native-*') if p.is_dir() and re.fullmatch(r'native-[0-9a-f]{7}-[0-9a-f]{12}',p.name)})
          proof={'declared_sdk':'f037744a79f9982c47876f49c5a3067279f88706','base':pathlib.Path('installed-base.txt').read_text().split()[1].rstrip('.'),'target':'server','native_versions':versions,'sdk_manifests':sdks}
          pathlib.Path('sdk-provenance.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizon-validation
          path: |
            horizon/target/horizon-mod/*.hmod
            target/horizon-mod/*.hmod
            horizon/Cargo.lock
            native-build.txt
            sdk-provenance.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            /tmp/horizon/target
          key: horizon-tool-f037744a-rust-1.99.1
